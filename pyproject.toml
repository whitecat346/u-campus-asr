[project]
name = "u-campus-asr"
version = "0.1.0"
description = "Local SenseVoice ASR service for the U校园 Tampermonkey userscript"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "funasr>=1.2.0",
  "modelscope>=1.20",
  "torch>=2.5",
  "torchaudio>=2.5",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
ucasr = "ucasr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucasr"]

[tool.ruff]
line-length = 110
target-version = "py312"
